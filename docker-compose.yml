services:
  db:
    image: pgvector/pgvector:pg16
    container_name: resolveai-db
    environment:
      POSTGRES_USER: resolveai
      POSTGRES_PASSWORD: resolveai
      POSTGRES_DB: resolveai
    ports:
      # 5432 is taken by a host PostgreSQL on this machine — use a dedicated port.
      - "55433:5432"
    volumes:
      - resolveai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resolveai -d resolveai"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      # repo root so the image can include fixtures/disputes for replay mode
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: resolveai-api
    env_file:
      - .env.local
    environment:
      # inside the compose network the DB is reachable as `db:5432`
      DATABASE_URL: postgresql+asyncpg://resolveai:resolveai@db:5432/resolveai
      APP_ENV: demo
      WEB_BASE_URL: http://localhost:3000
      FIXTURES_DIR: /app/fixtures/disputes
    ports:
      - "8000:8000"
    volumes:
      # dev ergonomics: edit code, `docker compose restart api` — no rebuild
      - ./apps/api/app:/app/app
      - ./apps/api/migrations:/app/migrations
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
      - ./fixtures:/app/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    container_name: resolveai-web
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      # dev server reads source from the host; node_modules stays in the image
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  resolveai_pgdata:
