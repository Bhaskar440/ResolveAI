# Render Blueprint for ResolveAI.
#
# One-click deploy: push this repository to GitHub, then in Render choose
# "New > Blueprint" and point it at the repo. See docs/13-deployment-render.md.
#
# Topology:
#   resolveai-web (Next.js, Docker)  --/api/v1 proxy-->  resolveai-api (FastAPI, Docker)
#                                                              |
#                                                              v
#                                                       resolveai-db (Postgres 16 + pgvector)
#
# Secrets are never written here. `generateValue` creates app-internal keys;
# `sync: false` asks you to paste third-party credentials in the Render UI.

databases:
  - name: resolveai-db
    databaseName: resolveai
    user: resolveai
    plan: free
    region: oregon
    postgresMajorVersion: 16

services:
  # ---------------------------------------------------------------------------
  # FastAPI + LangGraph + PayPal adapter. Runs Alembic on every boot.
  # ---------------------------------------------------------------------------
  - type: web
    name: resolveai-api
    runtime: docker
    plan: free
    region: oregon
    # No rootDir: the build context must be the repo root so the Dockerfile can
    # copy both apps/api/ and fixtures/. dockerfilePath is relative to the root.
    dockerfilePath: apps/api/Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: ResolveAI
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: TIMEZONE
        value: UTC
      # These are only used for generated links / OpenAPI metadata and CORS for
      # direct API calls. If Render suffixes the service names (name collision),
      # update all three in the Dashboard after the first deploy. See
      # docs/13-deployment-render.md section 4.
      - key: API_BASE_URL
        value: https://resolveai-api.onrender.com
      - key: WEB_BASE_URL
        value: https://resolveai-web.onrender.com
      - key: CORS_ORIGINS
        value: https://resolveai-web.onrender.com

      # Public demo: seeding/reset stay available, but every route is session-guarded.
      # Set DEMO_ENDPOINTS_ENABLED=false for a hardened deployment.
      - key: DEMO_ENDPOINTS_ENABLED
        value: "true"
      - key: DEMO_USER_EMAIL
        value: owner@northwind.example
      - key: DEMO_USER_PASSWORD
        value: resolveai-demo
      - key: DEMO_USER_NAME
        value: Avery Chen
      - key: DEMO_USER_ROLE
        value: owner

      # Session cookie. The browser talks to the Next.js origin, which proxies
      # /api/v1, so the cookie is first-party and Lax is sufficient.
      - key: AUTH_COOKIE_NAME
        value: resolveai_session
      - key: AUTH_SESSION_HOURS
        value: "12"
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: lax

      # Managed Postgres. The API normalizes postgres:// to postgresql+asyncpg://.
      - key: DATABASE_URL
        fromDatabase:
          name: resolveai-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
      - key: DB_POOL_RECYCLE_SECONDS
        value: "300"
      - key: PGVECTOR_ENABLED
        value: "true"

      # App-internal secrets: Render generates strong values once.
      - key: SECRET_KEY
        generateValue: true
      - key: CREDENTIAL_KEK
        generateValue: true
      - key: PII_HASH_PEPPER
        generateValue: true
      - key: PLAN_SIGNING_KEY
        generateValue: true

      # PayPal: replay is the fail-closed default for the public demo.
      # To run the live sandbox segment, set PAYPAL_MODE=sandbox and provide the
      # three sync:false values below. The webhook URL is:
      #   https://<your-api>.onrender.com/api/v1/webhooks/paypal
      - key: PAYPAL_MODE
        value: replay
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_VERIFY
        value: "true"
      - key: PAYPAL_WEBHOOK_MAX_SKEW_SECONDS
        value: "300"
      - key: PAYPAL_TIMEOUT_SECONDS
        value: "15"
      - key: PAYPAL_MAX_RETRIES
        value: "2"
      - key: ALLOW_LIVE_PAYPAL
        value: "false"
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false

      # Gemini. The free tier can return 503; runs then use the labelled
      # deterministic fallback rather than failing the request.
      - key: LLM_PROVIDER
        value: google
      - key: LLM_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: LLM_MODEL_REASONING
        value: gemini-3.5-flash
      - key: LLM_TEMPERATURE
        value: "0"
      - key: LLM_MAX_OUTPUT_TOKENS
        value: "1600"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_API_KEY
        sync: false
      - key: KNOWLEDGE_EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: KNOWLEDGE_EMBEDDING_DIMENSIONS
        value: "768"

      # Autonomy envelope. The deterministic gate reads these, not the model.
      - key: AUTONOMY_ENABLED
        value: "true"
      - key: AUTO_RESOLVE_CAP_USD
        value: "50"
      - key: AUTO_OFFER_CAP_USD
        value: "100"
      - key: AUTO_APPROVE_CONFIDENCE
        value: "0.80"
      - key: ESCALATE_CONFIDENCE
        value: "0.55"
      - key: APPROVAL_EXPIRY_MINUTES
        value: "120"
      - key: FRAUD_REASONS_REQUIRE_APPROVAL
        value: UNAUTHORISED,DUPLICATE_TRANSACTION
      - key: POLICY_RULESET_VERSION
        value: 2026.11.1

      # Replay fixtures are copied into the image at /app/fixtures.
      - key: FIXTURES_DIR
        value: /app/fixtures/disputes
      - key: STORAGE_BACKEND
        value: local
      - key: STORAGE_LOCAL_DIR
        value: /app/var/evidence

  # ---------------------------------------------------------------------------
  # Next.js dashboard. The browser only talks to this service; /api/v1 is
  # proxied to the API's public HTTPS URL at request time.
  # ---------------------------------------------------------------------------
  - type: web
    name: resolveai-web
    runtime: docker
    plan: free
    region: oregon
    rootDir: apps/web
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # Free Render web services cannot receive private-network traffic, so the
      # proxy calls the API's public HTTPS URL. RENDER_EXTERNAL_URL is injected
      # by Render into every web service and follows the actual hostname.
      - key: API_INTERNAL_URL
        fromService:
          type: web
          name: resolveai-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEXT_PUBLIC_APP_NAME
        value: ResolveAI
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "true"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
